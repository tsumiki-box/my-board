<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>マイボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="マイボード">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F7F9">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #F6F7F9; color: #1E2733; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 15px; line-height: 1.5; }
main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
form { width: 100%; max-width: 360px; background: #fff; border: 1px solid #E1E5EA; border-radius: 16px; padding: 28px 22px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: #6B7684; font-size: 13px; }
input[type=password] { width: 100%; height: 46px; border: 1px solid #E1E5EA; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px; }
input[type=password]:focus { outline: 2px solid #1F3A5F; outline-offset: -1px; }
label { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; font-size: 14px; color: #6B7684; }
label input { width: 18px; height: 18px; accent-color: #1F3A5F; }
button { width: 100%; height: 46px; border: 0; border-radius: 10px; background: #1F3A5F; color: #fff; font: inherit; font-weight: 600; }
button:disabled { opacity: .6; }
.err { color: #D9534F; margin: 10px 0 0; min-height: 1em; }
</style>
</head>
<body>
<main>
  <form id="lock-form" autocomplete="off">
    <h1>マイボード</h1>
    <p>合言葉を入れてください。</p>
    <input id="pass" type="password" placeholder="合言葉" autocomplete="current-password">
    <label><input type="checkbox" id="remember" checked>この端末で覚える（次から入力不要）</label>
    <button id="open-btn" type="submit">開く</button>
    <p class="err" id="lock-err"></p>
  </form>
</main>
<script>
// 中身（画面とデータ）はすべて data.enc.json に暗号化して入っている。合言葉で解いてから表示する
// 表示した画面の変数と名前がぶつからないよう、全体を ( ) で包んで外に名前を出さない
(() => {
'use strict';
const KEY_STORE = 'myboard-key-v1';
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...u));

async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(salt), iterations: iter }, base, 256);
  return new Uint8Array(bits);
}
async function decrypt(rawKey, blob) {
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(blob.iv) }, key, fromB64(blob.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function loadStoredKey() { try { return JSON.parse(localStorage.getItem(KEY_STORE)); } catch (e) { return null; } }
function storeKey(salt, raw) { try { localStorage.setItem(KEY_STORE, JSON.stringify({ salt, key: toB64(raw) })); } catch (e) {} }
function forgetKey() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }
function setErr(t) { document.getElementById('lock-err').textContent = t; }

function show(payload) {
  // データを画面に埋め込んで、ページ全体を入れ替える（「<」は文字として埋め込み、タグとして読まれないようにする）
  const data = JSON.stringify(payload.data).replace(/</g, '\\u003c');
  const html = payload.html.replace('"__DATA__"', () => data);
  document.open();
  document.write(html);
  document.close();
}

async function start() {
  let blob;
  try {
    const res = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error();
    blob = await res.json();
  } catch (e) {
    setErr('読み込めませんでした。電波の良いところでもう一度開いてください。');
    return;
  }
  const stored = loadStoredKey();
  if (stored && stored.salt === blob.salt) {
    try { show(await decrypt(fromB64(stored.key), blob)); return; } catch (e) { forgetKey(); }
  }
  document.getElementById('lock-form').onsubmit = async ev => {
    ev.preventDefault();
    const btn = document.getElementById('open-btn');
    const pass = document.getElementById('pass').value;
    if (!pass) { setErr('合言葉を入れてください'); return; }
    btn.disabled = true; btn.textContent = '確認しています…'; setErr('');
    try {
      const raw = await deriveKey(pass, blob.salt, blob.iter);
      const payload = await decrypt(raw, blob);
      if (document.getElementById('remember').checked) storeKey(blob.salt, raw);
      show(payload);
    } catch (e) {
      setErr('合言葉がちがうようです。もう一度入れてください。');
      btn.disabled = false; btn.textContent = '開く';
    }
  };
}
start();
})();
</script>
</body>
</html>
